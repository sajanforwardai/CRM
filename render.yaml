services:
  # PostgreSQL Database
  - type: pserv
    name: forwardai-crm-db
    plan: starter
    region: oregon

  # Express Backend API
  - type: web
    name: forwardai-crm-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd apps/server && pnpm install && pnpm run build
    startCommand: cd apps/server && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: forwardai-crm-db
          property: connectionString
      - key: JWT_SECRET
        sync: false

  # Next.js Frontend
  - type: web
    name: forwardai-crm-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd apps/web && pnpm install && pnpm run build
    startCommand: cd apps/web && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://forwardai-crm-api.onrender.com
